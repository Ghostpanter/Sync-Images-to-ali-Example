name: Sync-Images-to-ali-Example
run-name: ${{ github.actor }} is Sync Images to ali.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  syncimages:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repos
      uses: actions/checkout@v4

    - name: Login to Alibaba Cloud Container Registry
      env:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "$password" | docker login --username="$username" --password-stdin registry.cn-hangzhou.aliyuncs.com

    - name: Sync images from image.txt to ACR
      env:
        ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
        ACR_NAMESPACE: kkun
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y skopeo

        if [ ! -f image.txt ]; then
          echo "image.txt not found in repo root"
          exit 1
        fi

        failed=0
        while IFS= read -r raw || [ -n "$raw" ]; do
          line="${raw%%#*}"
          line="$(echo "$line" | xargs)"
          [ -z "$line" ] && continue

          src="$(echo "$line" | awk '{print $1}')"
          dest_name="$(echo "$line" | awk '{print $2}')"
          if [ -z "$dest_name" ]; then
            dest_name="${src##*/}"
          fi

          dst="${ACR_REGISTRY}/${ACR_NAMESPACE}/${dest_name}"
          echo "==== ${src} -> ${dst} ===="
          if ! skopeo copy \
            --override-os linux \
            --override-arch amd64 \
            "docker://${src}" \
            "docker://${dst}"; then
            echo "FAILED: ${src}"
            failed=1
          fi
        done < image.txt

        if [ "$failed" -ne 0 ]; then
          echo "Some images failed to sync"
          exit 1
        fi
