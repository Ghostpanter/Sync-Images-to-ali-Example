name: Sync-Images-to-ali-Example
run-name: ${{ github.actor }} is Sync Images to ali.

on:
  push:
    branches: [ "main" ]
    paths:
      - image.txt
      - .github/workflows/learn-github-actions.yml
      - scripts/sync-one.sh
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        env:
          CHUNK_SIZE: "8"
        run: |
          python3 <<'PY'
          import json, os, pathlib
          lines = []
          for raw in pathlib.Path("image.txt").read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if line:
                  lines.append(line)
          size = int(os.environ.get("CHUNK_SIZE", "8"))
          chunks = [lines[i:i + size] for i in range(0, len(lines), size)] or [[]]
          print(f"images={len(lines)} chunks={len(chunks)} size={size}")
          matrix = [{"id": i, "images": c} for i, c in enumerate(chunks)]
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("matrix=")
              f.write(json.dumps(matrix, ensure_ascii=False))
              f.write("\n")
          PY

  syncimages:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: shard-${{ matrix.chunk.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Alibaba Cloud Container Registry
        env:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$password" | docker login --username="$username" --password-stdin registry.cn-hangzhou.aliyuncs.com

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Sync shard ${{ matrix.chunk.id }}
        env:
          ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
          ACR_NAMESPACE: kkun
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if ! bash scripts/sync-one.sh "$line"; then
              failed=1
            fi
          done <<EOF
          ${{ join(matrix.chunk.images, '
') }}
          EOF
          if [ "$failed" -ne 0 ]; then
            echo "shard ${{ matrix.chunk.id }} had failures"
            exit 1
          fi
