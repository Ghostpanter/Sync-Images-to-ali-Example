name: Sync-Images-to-ali-Example
run-name: ${{ github.actor }} is Sync Images to ali.

concurrency:
  group: acr-sync-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - image.txt
      - .github/workflows/learn-github-actions.yml
      - scripts/**
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Parallel shards"
        default: "3"
        required: false
      jobs_per_shard:
        description: "Concurrent copies inside one shard"
        default: "3"
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        env:
          SHARD_COUNT: ${{ github.event.inputs.shard_count || '3' }}
        run: |
          python3 <<'PY'
          import json, os, pathlib
          n = 0
          for raw in pathlib.Path("image.txt").read_text(encoding="utf-8").splitlines():
              if raw.split("#", 1)[0].strip():
                  n += 1
          count = max(1, min(int(os.environ.get("SHARD_COUNT", "3")), n or 1))
          shards = list(range(count))
          print(f"images={n} shards={count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("shards=" + json.dumps(shards) + "\n")
          PY

  sync:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    name: shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq skopeo jq
          skopeo --version

      - name: Sync shard ${{ matrix.shard }}
        env:
          ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
          ACR_NAMESPACE: kkun
          SHARD_ID: ${{ matrix.shard }}
          SHARD_COUNT: ${{ github.event.inputs.shard_count || '3' }}
          PARALLEL: ${{ github.event.inputs.jobs_per_shard || '3' }}
        run: bash scripts/sync-all.sh
